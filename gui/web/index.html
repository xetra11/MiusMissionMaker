<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mius Mission Maker</title>
<style>
:root {
  --bg: #1d1f1b; --panel: #272a24; --panel2: #31352d; --line: #454a3f; --text: #e6e5dc; --muted: #a3a496;
  --accent: #c9a24b; --player: #5b9bd5; --enemy: #d9604f; --ok: #7fb069; --bad: #e0705f;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 "Segoe UI", system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
header { display: flex; gap: 8px; align-items: center; padding: 7px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 14px; margin: 0 10px 0 0; color: var(--accent); letter-spacing: .3px; }
main { display: grid; grid-template-columns: 300px minmax(300px, 1fr) 440px; min-height: 0; }
aside { background: var(--panel); overflow-y: auto; padding: 10px; }
aside.left { border-right: 1px solid var(--line); }
aside.right { border-left: 1px solid var(--line); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
#mapwrap { position: relative; min-width: 0; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
#hint { position: absolute; left: 10px; bottom: 8px; padding: 3px 7px; background: #000a; border-radius: 4px; color: var(--muted); pointer-events: none; }
#zoombar { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; }
#zoombar button { min-width: 30px; background: var(--panel); }
#formbar { position: absolute; left: 50%; bottom: 44px; white-space: nowrap; transform: translateX(-50%); display: none; gap: 6px; align-items: center; padding: 6px 8px; background: var(--panel); border: 1px solid var(--accent); border-radius: 5px; box-shadow: 0 2px 10px #0008; }
#mapopts { position: absolute; right: 10px; bottom: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
#mapopts label { padding: 3px 7px; background: #000a; border-radius: 4px; cursor: pointer; }
#coord:empty { display: none; }
#coord { padding: 3px 7px; background: #000a; border-radius: 4px; font-variant-numeric: tabular-nums; pointer-events: none; }
footer { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 10px; background: var(--panel); border-top: 1px solid var(--line); align-items: start; }
#log { height: 92px; overflow-y: auto; white-space: pre-wrap; font: 12px/1.35 Consolas, monospace; background: #151613; border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; color: var(--muted); }
#log .err { color: var(--bad); } #log .good { color: var(--ok); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 330px; }
#checks { grid-column: 1 / 3; min-height: 18px; }
#start { grid-column: 1 / 3; padding: 7px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); margin: 14px 0 6px; }
h2:first-child { margin-top: 0; }
label.f { display: block; margin-bottom: 7px; color: var(--muted); font-size: 12px; }
label.f > input, label.f > select, label.f > textarea { display: block; width: 100%; margin-top: 2px; }
input, select, textarea, button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
input[type=number] { font-variant-numeric: tabular-nums; }
input[type=checkbox] { width: auto; }
textarea { resize: vertical; min-height: 58px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #1c1a10; font-weight: 600; }
button.icon { padding: 1px 7px; color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: Consolas, monospace; font-size: 12px; }
.tabs { display: flex; background: var(--panel2); border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 4px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
#panel { padding: 10px; overflow-y: auto; flex: 1; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 7px; margin-bottom: 6px; }
.card.wrong { border-color: var(--bad); }
.pt { display: grid; grid-template-columns: 12px 1fr 62px 62px 24px; gap: 4px; align-items: center; margin-bottom: 4px; }
.pt input { padding: 2px 4px; width: 100%; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.units { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; margin-top: 5px; }
.unit { display: flex; gap: 8px; align-items: center; padding: 4px 7px; border-bottom: 1px solid #3a3e35; cursor: pointer; }
.sym { flex: none; display: block; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit:hover { background: var(--panel2); }
.unit b { font-weight: 600; }
.tag { display: inline-block; padding: 0 4px; border-radius: 3px; font-size: 11px; background: #0003; color: var(--muted); margin-left: 4px; }
.tag.warn { color: var(--bad); }
.tag.good { color: var(--ok); }
#checks { margin: 0; padding: 0; list-style: none; font-size: 12px; }
#checks li { color: var(--bad); }
#checks li.good { color: var(--ok); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 14px; width: 560px; }
dialog::backdrop { background: #0008; }
#banner { display: none; padding: 5px 10px; background: #5a4a1a; color: #f0e2b0; }
</style>
</head>
<body>
<header>
  <h1>Mius Mission Maker</h1>
  <span id="version" class="small muted" style="margin:0 10px 0 -6px"></span>
  <button id="new">New</button>
  <select id="open" title="Open a scenario"></select>
  <span class="grow"></span>
  <button id="mods">Installed missions</button>
  <button id="settings">Settings</button>
</header>
<main>
  <aside class="left" id="left"></aside>
  <div>
    <div id="banner"></div>
    <div id="mapwrap" style="height:100%">
      <canvas id="map"></canvas>
      <div id="hint"></div>
      <div id="mapopts"><label title="The game's map: fields, forest, roads, water and contour lines"><input type="checkbox" id="showterrain"> Terrain</label><label title="Show where each platoon faces and its formation"><input type="checkbox" id="showsetup"> Facing &amp; formation</label><span id="coord"></span></div>
      <div id="formbar"></div>
      <div id="zoombar">
        <button id="zoomin" title="Zoom in (mouse wheel)">+</button>
        <button id="zoomout" title="Zoom out (mouse wheel)">−</button>
        <button id="zoomfit" title="Show the whole map">Fit</button>
      </div>
    </div>
  </div>
  <aside class="right">
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </aside>
</main>
<footer>
  <div id="log"></div>
  <div class="actions">
    <ul id="checks"></ul>
    <button id="save">Save</button>
    <button id="build">Build &amp; check</button>
    <button id="install" style="grid-column: 1 / 3">Build &amp; install in game</button>
    <button id="start" class="primary" title="Build this mission and start it directly in the game (close the game first)">Start battle</button>
  </div>
</footer>
<dialog id="dlg"></dialog>

<script>
'use strict';
const API = '/api/' + location.hash.slice(1);
const IN_SERVICE_DATE = 0x19430701; // all bases are set on this date
let cat, s, tab = 'player', unitSearch = '', unitKind = '', selected = null, hover = null, drag = null;
// platoon picked on the map, and the platoon waiting for a click on the map
let picked = null, placing = null;
// platoon cards showing their details
const opened = new Set();
// waiting for a click that adds a point; platoons chosen on the map, the selection box being drawn
let addingPoint = false, box = null, formSpacing = 100;
// facing and formation on the map counters, chosen at the bottom right of the map
let showSetup = localStorage.getItem('mmm.showSetup') === '1';
let showTerrain = localStorage.getItem('mmm.showTerrain') !== '0';
const chosen = new Set();

// ---------------------------------------------------------------- helpers
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e && k !== 'list') e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(3)) if (c !== null && c !== undefined) e.append(c);
  return e;
}
const fill = (el, ...kids) => el.replaceChildren(...kids.flat(3).filter(k => k !== null && k !== undefined));
const field = (label, control) => h('label', { class: 'f' }, label, control);
function select(options, value, onchange, extra = {}) {
  const e = h('select', { onchange: () => onchange(e.value), ...extra },
    options.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return h('option', { value: v }, t); }));
  e.value = value ?? '';
  return e;
}
function input(value, oninput, extra = {}) {
  return h('input', { value: value ?? '', oninput: e => oninput(e.target.value), ...extra });
}
function number(value, oninput, extra = {}) {
  return input(value, v => oninput(v === '' ? undefined : Number(v)), { type: 'number', ...extra });
}
async function api(path, body) {
  const r = await fetch(API + path, body === undefined ? {} : { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}
function log(text, cls) {
  const box = document.getElementById('log');
  box.append(h('div', { class: cls ?? '' }, text));
  box.scrollTop = box.scrollHeight;
}
const base = () => cat.bases.find(b => b.id === s.base);
const unitOf = key => cat.units.find(u => u.key === key.split('@')[0]);
const nationName = n => ({ GER: 'German', USSR: 'Soviet' })[n] ?? n;
const pointNames = () => Object.keys(s.points);
const pointOptions = () => [['', '-'], ...pointNames()];

// ---------------------------------------------------------------- scenario
function blank() {
  return {
    $schema: '../scenario.schema.json', id: 'my_mission', title: 'New Mission', description: '', menu: 'missions', base: 'tr04',
    max_minutes: 60, points: {},
    sides: { player: { deploy: { type: 'trench' }, platoons: [] }, enemy: { deploy: { type: 'place' }, platoons: [] } },
    victory: { balance: 2 }, defeat: {}, texts: {},
  };
}
function normalise(o) {
  o.points ??= {}; o.sides ??= {}; o.victory ??= {}; o.defeat ??= {}; o.texts ??= {};
  for (const k of ['player', 'enemy']) { o.sides[k] ??= {}; o.sides[k].platoons ??= []; o.sides[k].deploy ??= {}; }
  return o;
}
// the file holds only what is set
function clean() {
  const o = JSON.parse(JSON.stringify(s));
  const prune = x => { for (const k of Object.keys(x)) if (x[k] === '' || x[k] === null || x[k] === undefined) delete x[k]; };
  prune(o);
  for (const k of ['player', 'enemy']) {
    const side = o.sides[k];
    // a deploy without a point keeps only the set-up defaults of the side or group
    const keep = (o, k) => { if (o[k]) prune(o[k]); if (o[k] && !Object.keys(o[k]).length) delete o[k]; };
    keep(side, 'deploy');
    if (!side.orders?.length) delete side.orders;
    for (const d of Object.values(side.groups ?? {})) {
      keep(d, 'deploy');
      if (!d.orders?.length) delete d.orders;
    }
    if (side.groups && !Object.keys(side.groups).length) delete side.groups;
    for (const p of side.platoons) {
      prune(p);
      // without a point the deploy only keeps the set-up style of a platoon placed on the map
      if (p.deploy && !p.deploy.at && !p.position) delete p.deploy;
      else if (p.deploy) { prune(p.deploy); if (!Object.keys(p.deploy).length) delete p.deploy; }
    }
  }
  for (const k of ['victory', 'defeat', 'texts', 'camera']) {
    if (!o[k]) continue;
    prune(o[k]);
    if (!Object.keys(o[k]).length) delete o[k];
  }
  return o;
}
function renamePoint(from, to) {
  const swap = v => (v === from ? to : v);
  const pts = {};
  for (const [k, v] of Object.entries(s.points)) pts[k === from ? to : k] = v;
  s.points = pts;
  for (const k of ['player', 'enemy']) {
    const side = s.sides[k];
    if (side.deploy) side.deploy.at = swap(side.deploy.at);
    for (const o of side.orders ?? []) o.to = swap(o.to);
    for (const d of Object.values(side.groups ?? {})) {
      if (d.deploy) d.deploy.at = swap(d.deploy.at);
      for (const o of d.orders ?? []) o.to = swap(o.to);
    }
    for (const p of side.platoons) if (p.deploy?.at !== undefined) p.deploy.at = swap(p.deploy.at);
  }
  if (s.victory.own_reaches) s.victory.own_reaches = swap(s.victory.own_reaches);
  if (s.defeat.enemy_reaches) s.defeat.enemy_reaches = swap(s.defeat.enemy_reaches);
  if (s.camera?.at) s.camera.at = swap(s.camera.at);
  if (selected === from) selected = to;
}
function addPoint(name, x, z) {
  let n = name.toLowerCase().replace(/[^a-z0-9_]/g, '_').replace(/^[^a-z]+/, '') || 'point', i = 1, t = n;
  while (t in s.points || cat.enums.reserved.includes(t)) t = n + '_' + (++i);
  s.points[t] = [Math.round(x), Math.round(z)];
  selected = t;
  refresh();
  return t;
}
// group names share one name space with points and callsigns, across both sides
const groupNames = () => ['player', 'enemy'].flatMap(k => Object.keys(s.sides[k].groups ?? {}));
const nameTaken = n => n in s.points || groupNames().includes(n) || ['player', 'enemy'].some(k => s.sides[k].platoons.some(p => p.callsign === n));
function addGroup(sideKey) {
  const side = s.sides[sideKey];
  let i = 1;
  while (nameTaken(`group_${i}`)) i++;
  (side.groups ??= {})[`group_${i}`] = {};
  refreshKeep();
}
function renameGroup(sideKey, from, to) {
  const side = s.sides[sideKey];
  if (to === from || !/^[a-z][a-z0-9_]{0,30}$/.test(to) || cat.enums.reserved.includes(to) || nameTaken(to)) { refreshKeep(); return; }
  side.groups = Object.fromEntries(Object.entries(side.groups).map(([k, v]) => [k === from ? to : k, v]));
  for (const p of side.platoons) if (p.group === from) p.group = to;
  refreshKeep();
}
function removeGroup(sideKey, g) {
  const side = s.sides[sideKey];
  delete side.groups[g];
  for (const p of side.platoons) if (p.group === g) delete p.group;
  refreshKeep();
}
// where a platoon put on the map starts: its group's or side's point, else the middle of its start area
function startPosition(sideKey, p) {
  const side = s.sides[sideKey], at = side.groups?.[p.group]?.deploy?.at || side.deploy?.at;
  if (s.points[at]) return [...s.points[at]];
  const cells = base().cells.filter(c => c.side === sideKey);
  if (!cells.length) return [0, 0];
  return [Math.round(cells.reduce((a, c) => a + c.x, 0) / cells.length), Math.round(cells.reduce((a, c) => a + c.z, 0) / cells.length)];
}
// a spot near the start of the side where no other platoon stands, for a newly added platoon
function freeSpot(sideKey) {
  const [x0, z0] = startPosition(sideKey, {}), all = ['player', 'enemy'].flatMap(k => s.sides[k].platoons).filter(p => p.position);
  for (let ring = 0; ring < 12; ring++) {
    for (let i = -ring; i <= ring; i++) {
      for (const [dx, dz] of [[i, -ring], [i, ring], [-ring, i], [ring, i]]) {
        const x = x0 + dx * 100, z = z0 + dz * 100;
        if (allowedAt(sideKey, x, z) && !all.some(p => Math.hypot(p.position[0] - x, p.position[1] - z) < 70)) return [x, z];
      }
    }
  }
  return nearestAllowed(sideKey, x0, z0);
}
// set-up of a platoon as the generator writes it: its own style over that of its group, else of its side
const TYPE_NAMES = { trench: 'dug in', place: 'in the open' };
const facingTo = (from, to) => { const dx = to[0] - from[0], dz = to[1] - from[1]; return Math.abs(dx) >= Math.abs(dz) ? (dx >= 0 ? 'E' : 'W') : (dz >= 0 ? 'N' : 'S'); };
function anchorOf(sideKey) {
  const side = s.sides[sideKey], p = side.platoons[0];
  return s.points[side.deploy?.at] ?? p?.position ?? s.points[p?.deploy?.at] ?? s.points[side.groups?.[p?.group]?.deploy?.at] ?? [0, 0];
}
function styleOf(sideKey, p) {
  const side = s.sides[sideKey], d = { ...(side.groups?.[p.group]?.deploy ?? side.deploy), ...p.deploy };
  const type = d.type || 'place';
  const from = p.position ?? s.points[d.at] ?? [0, 0];
  return { type, formation: d.formation || (type === 'trench' ? 'line2' : 'columnlr'), facing: d.facing || facingTo(from, anchorOf(sideKey === 'player' ? 'enemy' : 'player')) };
}
// platoons of older scenarios that set up at a point: put them on the map in a line around that point
function placeOnMap(sideKey) {
  const side = s.sides[sideKey], at = new Map();
  for (const p of side.platoons.filter(p => !p.position)) {
    const name = p.deploy?.at || side.groups?.[p.group]?.deploy?.at || side.deploy?.at;
    const pt = s.points[name] ?? startPosition(sideKey, p);
    putOnMap(p, ...pt);
    (at.get(name) ?? at.set(name, []).get(name)).push(p);
  }
  for (const list of at.values()) arrangeList(list, 'line', false);
  for (const d of [side.deploy, ...Object.values(side.groups ?? {}).map(g => g.deploy)]) if (d) delete d.at;
  refreshKeep();
}
function areaOf(x, z) {
  const b = base(), e = b.extent, r = b.cellSize / 2;
  if (x < e.x0 || x > e.x1 || z < e.z0 || z > e.z1) return 'outside';
  return b.cells.find(c => Math.abs(x - c.x) <= r && Math.abs(z - c.z) <= r)?.side ?? 'neutral';
}
// player platoons set up only in the player start area, enemy platoons anywhere but there
function allowedAt(sideKey, x, z) {
  const a = areaOf(x, z);
  return a !== 'outside' && (sideKey === 'player') === (a === 'player');
}
const sideOfPlatoon = p => ['player', 'enemy'].find(k => s.sides[k].platoons.includes(p));
// the nearest position to x, z where a platoon of the side may stand
function nearestAllowed(sideKey, x, z) {
  const b = base(), e = b.extent, clamp = (v, a, c) => Math.min(c, Math.max(a, v));
  x = clamp(Math.round(x), e.x0 + 10, e.x1 - 10); z = clamp(Math.round(z), e.z0 + 10, e.z1 - 10);
  if (!sideKey || allowedAt(sideKey, x, z)) return [x, z];
  const own = b.cells.filter(c => c.side === 'player');
  const spots = sideKey === 'player'
    ? own.map(c => { const r = b.cellSize / 2 - 10; return [clamp(x, c.x - r, c.x + r), clamp(z, c.z - r, c.z + r)]; })
    : own.flatMap(c => { const r = b.cellSize / 2 + 10; return [[c.x - r, z], [c.x + r, z], [x, c.z - r], [x, c.z + r]]; });
  const ok = spots.filter(q => allowedAt(sideKey, ...q));
  return ok.length ? ok.reduce((a, q) => Math.hypot(q[0] - x, q[1] - z) < Math.hypot(a[0] - x, a[1] - z) ? q : a) : [x, z];
}
function checks() {
  const out = [], b = base();
  if (!/^[a-z0-9_]{1,40}$/.test(s.id ?? '')) out.push('Mission id: a-z, 0-9, _ only');
  if (!s.title) out.push('Title is missing');
  if (/[^\x20-\x7e]/.test((s.title ?? '') + (s.description ?? '').replace(/[äöüÄÖÜß]/g, ''))) out.push('Title/description: plain characters only');
  const seen = new Set();
  for (const [k, nation] of [['player', b.player], ['enemy', b.enemy]]) {
    const side = s.sides[k], groups = side.groups ?? {};
    if (!side.platoons.length) out.push(`${k}: no platoons`);
    const off = side.platoons.filter(p => !p.position && !p.deploy?.at && !groups[p.group]?.deploy?.at && !side.deploy?.at);
    if (off.length) out.push(`${k}: ${off.map(p => p.callsign).join(', ')} not on the map`);
    for (const p of side.platoons) {
      if (seen.has(p.callsign)) out.push(`Callsign ${p.callsign} used twice`);
      seen.add(p.callsign);
      if (unitOf(p.unit)?.nation !== nation) out.push(`${p.callsign}: not a ${nationName(nation)} unit`);
      if (p.position && areaOf(...p.position) === 'outside') out.push(`${p.callsign} is outside the map`);
      else if (p.position && !allowedAt(k, ...p.position)) out.push(k === 'player' ? `${p.callsign} stands outside the blue start area` : `${p.callsign} stands in the blue start area`);
    }
  }
  for (const g of groupNames()) if (g in s.points || seen.has(g)) out.push(`Group ${g}: name already used by a point or callsign`);
  for (const [n, [x, z]] of Object.entries(s.points)) if (areaOf(x, z) === 'outside') out.push(`Point ${n} is outside the map`);
  return out;
}
function showChecks() {
  const list = checks(), box = document.getElementById('checks');
  box.replaceChildren(...(list.length ? list.slice(0, 3).map(t => h('li', {}, t)) : [h('li', { class: 'good' }, 'Ready to build')]));
}

// ---------------------------------------------------------------- left panel
function renderLeft() {
  const b = base();
  const left = document.getElementById('left');
  const settle = b.settlements.map(p => h('div', {
    class: 'unit small', title: 'Add as point', onclick: () => addPoint('village', p.x, p.z),
  }, `${p.houses} houses at [${p.x}, ${p.z}]`, h('span', { class: 'tag' }, p.area)));
  fill(left,
    h('h2', {}, 'Mission'),
    field('Title', input(s.title, v => { s.title = v; showChecks(); })),
    field('Mission id (file name)', input(s.id, v => { s.id = v; showChecks(); }, { class: 'mono' })),

    const [px, py] = q.at, big = front(q) > 0, lx = px + (PLATE[0] + (showSetup ? 9 : 0)) * q.sc + 3, u = unitOf(q.p.unit);
    const lines = big || detailed ? [[q.p.callsign, big ? '#fff' : '#ddd'], [u?.name ?? q.p.unit, '#bbb']] : [];
    const tries = [lines, [[q.p.callsign, '#ddd']], [[q.p.callsign.replace(/^.*_/, ''), '#ccc']]].filter(l => l.length);
    for (const l of tries) {
      const w = Math.max(...l.map(([t]) => ctx.measureText(t).width)), y0 = py + (l.length > 1 ? -9 : -5);
      const r = [lx, y0, lx + w, y0 + l.length * 13];
      if (!big && !fits(r)) continue;
      taken.push(r);
      l.forEach(([t, c], i) => label(t, lx, y0 + 10 + i * 13, c));
      break;
    }
  }
  for (const [n, [x, z]] of Object.entries(pts)) {
    const [px, py] = toScreen(x, z), color = used[n] ? css(used[n]) : css('--accent');
    ctx.fillStyle = color; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, selected === n ? 8 : 6, 0, 7); ctx.fill(); ctx.stroke();

  const len = 1000 * view.k, [bx, by] = [x1 - len - 12, y1 - 12];
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + len, by); ctx.stroke();
  label('1 km', bx, by - 5, '#ddd');
  if (box) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]); ctx.fillStyle = '#ffffff14';
    ctx.fillRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);
    ctx.strokeRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0); ctx.setLineDash([]);
  }
}
// a platoon on the map as a counter: a dark plate with the side's colour as border and the
// tactical symbol on it. With the set-up shown, a wedge on the plate's edge points where the
// platoon faces, and a tag under the plate names its formation and whether it is dug in.
const FACING_DIR = { N: [0, -1], NE: [0.71, -0.71], E: [1, 0], SE: [0.71, 0.71], S: [0, 1], SW: [-0.71, 0.71], W: [-1, 0], NW: [-0.71, -0.71] };
const PLATE = [17, 12]; // half width and height at scale 1
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawCounter(u, st, x, y, sc, color, marked) {
  const [hw, hh] = [PLATE[0] * sc, PLATE[1] * sc];
  ctx.save();
  if (showSetup) {
    // facing: a wedge where the direction leaves the plate
    const [dx, dy] = FACING_DIR[st.facing] ?? [1, 0], t = Math.min(hw / Math.abs(dx || 1e-9), hh / Math.abs(dy || 1e-9));
    const [ex, ey] = [x + dx * t, y + dy * t], [rx, ry] = [-dy, dx], w = 5 * sc, l = 8 * sc;
    ctx.beginPath(); ctx.moveTo(ex - dx * 2 + rx * w, ey - dy * 2 + ry * w); ctx.lineTo(ex + dx * l, ey + dy * l); ctx.lineTo(ex - dx * 2 - rx * w, ey - dy * 2 - ry * w);
    ctx.closePath(); ctx.fillStyle = color; ctx.strokeStyle = HALO; ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke();
  }
  roundRect(x - hw, y - hh, hw * 2, hh * 2, 3 * sc);
  ctx.fillStyle = '#171913e6'; ctx.fill();
  ctx.strokeStyle = marked ? '#fff' : color; ctx.lineWidth = marked ? 2.5 : 1.6; ctx.stroke();
  ctx.restore();
  drawSymbol(u, x, y, color, 0.7 * sc, '#171913');
}
// the tag under a counter; returns its rectangle, drawn only if `fits` accepts it
function counterTag(st, x, y, sc, color, fits) {
  const text = `${st.type === 'trench' ? 'dug in · ' : ''}${st.formation}`;
  ctx.save();
  ctx.font = '10px "Segoe UI"'; ctx.textAlign = 'center';
  const tw = ctx.measureText(text).width + 8, ty = y + PLATE[1] * sc + 3, r = [x - tw / 2, ty, x + tw / 2, ty + 13];
  if (fits(r)) {
    roundRect(x - tw / 2, ty, tw, 13, 3);
    ctx.fillStyle = st.type === 'trench' ? '#4a3d22f0' : '#171913e6'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#e8e2cc'; ctx.fillText(text, x, ty + 10);

}
function pick(px, py) {
  let near = null, best = Infinity;
  for (const k of ['player', 'enemy']) {
    for (const p of s.sides[k].platoons) {
      if (!p.position) continue;
      const [sx, sy] = toScreen(...p.position), d = Math.hypot(sx - px, sy - py), g = 0.85 * Math.min(1.5, 1 + (zoom.f - 1) * 0.12);
      if (Math.abs(sx - px) < PLATE[0] * g && Math.abs(sy - py) < PLATE[1] * g && d < best) { near = { platoon: p, side: k }; best = d; }
    }
  }
  if (near) return near;
  for (const [n, [x, z]] of Object.entries(s.points)) { const [sx, sy] = toScreen(x, z); if (Math.hypot(sx - px, sy - py) < 10) return { point: n }; }
  for (const p of base().points) { const [sx, sy] = toScreen(p.x, p.z); if (Math.hypot(sx - px, sy - py) < 7) return { known: p }; }
  for (const p of base().settlements) {
    const [sx, sy] = toScreen(p.x, p.z), rw = Math.max(p.width * view.k, 7) / 2 + 2, rh = Math.max(p.depth * view.k, 7) / 2 + 2;
    if (Math.abs(sx - px) < rw && Math.abs(sy - py) < rh) return { settlement: p };

}
// shows the card of a platoon picked on the map
function showPlatoon(sideKey, p) {
  picked = p;
  opened.add(p);
  if (tab !== sideKey) { tab = sideKey; renderTabs(); }
  refreshKeep();
  document.getElementById('platoon-' + p.callsign)?.scrollIntoView({ block: 'nearest' });
}
// the wheel zooms around the mouse; the right or middle button pans
function zoomAt(px, py, f) {
  const [mx, mz] = toMap(px, py), e = base().extent;
  zoom.f = Math.min(24, Math.max(1, f));
  draw();
  // keep the map position under the mouse where it was
  const [nx, nz] = toMap(px, py), cx = (zoom.cx ?? (e.x0 + e.x1) / 2) + mx - nx, cz = (zoom.cz ?? (e.z0 + e.z1) / 2) + mz - nz;
  zoom.cx = Math.min(e.x1, Math.max(e.x0, cx)); zoom.cz = Math.min(e.z1, Math.max(e.z0, cz));

canvas.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, zoom.f * Math.pow(1.0015, -e.deltaY)); }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => {
  const [mx, mz] = toMap(e.offsetX, e.offsetY);
  if (e.button !== 0) {
    const ext = base().extent;
    pan = { px: e.offsetX, py: e.offsetY, cx: zoom.cx ?? (ext.x0 + ext.x1) / 2, cz: zoom.cz ?? (ext.z0 + ext.z1) / 2 };
    canvas.style.cursor = 'grabbing';
    return;
  }
  const hit = pick(e.offsetX, e.offsetY);
  if (placing) {
    if (areaOf(mx, mz) !== 'outside') putOnMap(placing, mx, mz);
    placing = null; refreshKeep();
    return;
  }
  if (addingPoint) {
    addingPoint = false;
    if (hit?.known) addPoint(hit.known.name, hit.known.x, hit.known.z);
    else if (hit?.settlement) addPoint('village', hit.settlement.x, hit.settlement.z);
    else if (areaOf(mx, mz) !== 'outside') addPoint('point', mx, mz);
    else refresh();
    return;
  }
  if (hit?.platoon) {
    const p = hit.platoon;
    if (e.shiftKey) { if (chosen.has(p)) chosen.delete(p); else chosen.add(p); setHint(); draw(); return; }
    // dragging one of several chosen platoons moves them all
    if (!chosen.has(p)) { chosen.clear(); chosen.add(p); }
    drag = { start: [mx, mz], moving: [...chosen].filter(q => q.position).map(q => [q, [...q.position], sideOfPlatoon(q)]) };
    showPlatoon(hit.side, p);
    return;
  }
  if (hit?.point) { drag = { point: hit.point }; selected = hit.point; draw(); return; }
  box = { x0: e.offsetX, y0: e.offsetY, x1: e.offsetX, y1: e.offsetY, add: e.shiftKey };
});
canvas.addEventListener('mousemove', e => {
  const [x, z] = toMap(e.offsetX, e.offsetY);
  document.getElementById('coord').textContent = `x ${Math.round(x)}  z ${Math.round(z)}  ${areaOf(x, z)}`;
  if (pan) {
    const e2 = base().extent;
    zoom.cx = Math.min(e2.x1, Math.max(e2.x0, pan.cx - (e.offsetX - pan.px) / view.k));
    zoom.cz = Math.min(e2.z1, Math.max(e2.z0, pan.cz + (e.offsetY - pan.py) / view.k));
    draw();
    return;
  }
  if (box) { box.x1 = e.offsetX; box.y1 = e.offsetY; draw(); return; }
  if (drag) {
    if (drag.point) s.points[drag.point] = [Math.round(x), Math.round(z)];
    else {
      // at the edge of the area they may use, the platoons slide along it
      const [dx, dz] = [x - drag.start[0], z - drag.start[1]];
      const fits = ([ax, az]) => drag.moving.every(([, [px, pz], k]) => !allowedAt(k, px, pz) || allowedAt(k, Math.round(px + ax), Math.round(pz + az)));
      const step = [[dx, dz], [dx, 0], [0, dz]].find(fits);
      if (step) for (const [q, [px, pz]] of drag.moving) q.position = [Math.round(px + step[0]), Math.round(pz + step[1])];
    }
    draw();
    return;
  }
  hover = pick(e.offsetX, e.offsetY);
  if (!placing && !addingPoint) canvas.style.cursor = hover?.platoon || hover?.point ? 'pointer' : 'default';
  const u = hover?.platoon && unitOf(hover.platoon.unit);
  canvas.title = hover?.settlement ? `${hover.settlement.houses} houses, ${hover.settlement.width} x ${hover.settlement.depth} m`
    : hover?.platoon ? `${hover.platoon.callsign}: ${unitTitle(u)}\n${unitDetails(u)}\n${setupText(hover.side, hover.platoon)}` : '';
  draw();
});
window.addEventListener('mouseup', () => {
  if (pan) { pan = null; setHint(); return; }
  if (box) {
    const [xa, xb] = [Math.min(box.x0, box.x1), Math.max(box.x0, box.x1)], [ya, yb] = [Math.min(box.y0, box.y1), Math.max(box.y0, box.y1)];
    if (!box.add) chosen.clear();
    // a plain click on open ground only clears the selection
    if (xb - xa > 3 || yb - ya > 3) {
      for (const k of ['player', 'enemy']) {
        for (const p of s.sides[k].platoons) {
          if (!p.position) continue;
          const [px, py] = toScreen(...p.position);
          if (px >= xa && px <= xb && py >= ya && py <= yb) chosen.add(p);

  if (!drag) return;

window.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.target.closest?.('input, textarea, select')) return;

  renderLeft(); refreshKeep();

new ResizeObserver(resize).observe(canvas.parentElement);
const setupBox = document.getElementById('showsetup');
setupBox.checked = showSetup;
setupBox.addEventListener('change', () => { showSetup = setupBox.checked; localStorage.setItem('mmm.showSetup', showSetup ? '1' : '0'); draw(); });
const terrainBox = document.getElementById('showterrain');
terrainBox.checked = showTerrain;
terrainBox.addEventListener('change', () => { showTerrain = terrainBox.checked; localStorage.setItem('mmm.showTerrain', showTerrain ? '1' : '0'); draw(); });
const zoomCentre = f => zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, zoom.f * f);
document.getElementById('zoomin').addEventListener('click', () => zoomCentre(1.5));
document.getElementById('zoomout').addEventListener('click', () => zoomCentre(1 / 1.5));
document.getElementById('zoomfit').addEventListener('click', () => { resetZoom(); draw(); });

// ---------------------------------------------------------------- toolbar
async function fillOpen(current) {
  const list = await api('/scenarios');
  const open = document.getElementById('open');
  open.replaceChildren(h('option', { value: '' }, 'Open...'),
    ...['scenarios', 'examples'].map(g => h('optgroup', { label: g }, list.filter(f => f.group === g).map(f => h('option', { value: f.path }, f.name)))));
  open.value = current ?? '';
}
document.getElementById('open').addEventListener('change', async e => {
  if (!e.target.value) return;
  s = normalise(await api('/scenario?path=' + encodeURIComponent(e.target.value)));
  selected = null; picked = null; placing = null; opened.clear(); chosen.clear(); addingPoint = false; resetZoom();
  refresh();
  log('Opened ' + e.target.value);
});
document.getElementById('new').addEventListener('click', () => { s = blank(); selected = null; picked = null; placing = null; opened.clear(); chosen.clear(); addingPoint = false; resetZoom(); refresh(); });
document.getElementById('save').addEventListener('click', async () => {
  try { const r = await api('/save', clean()); log('Saved ' + r.file, 'good'); await fillOpen(`scenarios/${s.id}.json`); } catch (e) { log(e.message, 'err'); }
});
async function build(install, start) {
  log(start ? 'Starting battle...' : install ? 'Building and installing...' : 'Building...');
  try {
    const r = await api('/build', { scenario: clean(), install, start });
    log(r.output.trim(), r.ok ? '' : 'err');
    const done = start ? 'Battle started, the game window opens in a moment' : install ? 'Installed. Start the game: QUICK BATTLE > ' + (s.menu === 'training' ? 'Training' : 'Missions') : 'Build OK';
    log(r.ok ? done : 'Failed', r.ok ? 'good' : 'err');
    await fillOpen(`scenarios/${s.id}.json`);
  } catch (e) { log(e.message, 'err'); }
}
document.getElementById('build').addEventListener('click', () => build(false, false));
document.getElementById('install').addEventListener('click', () => build(true, false));
document.getElementById('start').addEventListener('click', () => build(false, true));
const dlg = document.getElementById('dlg');
document.getElementById('settings').addEventListener('click', async () => {
  const st = await api('/settings');
  const path = input(st.gameDir, v => { st.gameDir = v; });
  dlg.replaceChildren(h('h2', {}, 'Settings'), field('Game folder', path),
    h('div', { class: 'row' }, h('span', { class: 'grow' }), h('button', { onclick: () => dlg.close() }, 'Cancel'),
      h('button', { class: 'primary', onclick: async () => { await api('/settings', st); dlg.close(); } }, 'Save')));
  dlg.showModal();
});
document.getElementById('mods').addEventListener('click', async () => {
  const r = await api('/mods');
  const rows = r.output.trim().split('\n').filter(Boolean).map(l => {
    const name = l.match(/'([^']+)'/)?.[1];
    return h('div', { class: 'card row' }, h('div', { class: 'grow small mono' }, l.replace(/^\S+\s+/, '')),
      name ? h('button', { onclick: async e => {
        const res = await api('/uninstall', { name });
        log(res.output.trim(), res.ok ? 'good' : 'err');
        e.target.closest('.card').remove();
      } }, 'Remove') : null);
  });
  dlg.replaceChildren(h('h2', {}, 'Installed missions'), rows.length ? h('div', {}, rows) : h('div', { class: 'muted' }, 'None'),
    h('div', { class: 'small muted', style: 'margin:8px 0' }, 'Close the game before removing.'),
    h('div', { class: 'row' }, h('span', { class: 'grow' }), h('button', { onclick: () => dlg.close() }, 'Close')));
  dlg.showModal();
});

(async () => {
  document.body.append(h('datalist', { id: 'callsigns' }));
  api('/version').then(v => { document.getElementById('version').textContent = v.version; }).catch(() => {});
  try {
    cat = await api('/catalog');
    document.getElementById('callsigns').append(...cat.enums.callsigns.map(c => h('option', { value: c + '_01' })));

    refresh();
