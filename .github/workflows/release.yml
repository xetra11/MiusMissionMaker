name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum

      - name: Build
        working-directory: gui
        run: go build -ldflags=-H=windowsgui -o ../MiusMissionMaker.exe .

      # the program runs the tools next to it, so it ships together with them
      - name: Package
        shell: pwsh
        run: |
          $pkg = 'dist/MiusMissionMaker'
          New-Item -ItemType Directory -Path $pkg | Out-Null
          Copy-Item MiusMissionMaker.exe, README.md, CHANGELOG.md, scenario.schema.json -Destination $pkg
          Copy-Item tools, examples, docs -Destination $pkg -Recurse
          Compress-Archive -Path $pkg -DestinationPath dist/MiusMissionMaker-windows.zip

      # the release notes are the section of CHANGELOG.md for this version
      - name: Release notes
        shell: pwsh
        run: |
          $version = [regex]::Escape(($env:GITHUB_REF_NAME -replace '^v', ''))
          $lines = Get-Content CHANGELOG.md
          $start = [array]::FindIndex($lines, [Predicate[string]] { param($l) $l -match "^## v?$version( |$)" })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $env:GITHUB_REF_NAME" }
          $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]] { param($l) $l -match '^## ' })
          if ($end -lt 0) { $end = $lines.Count }
          $notes = if ($end - $start -gt 1) { ($lines[($start + 1)..($end - 1)] -join "`n").Trim() }
          if (-not $notes) { throw "the section for $env:GITHUB_REF_NAME in CHANGELOG.md is empty" }
          $notes | Out-File -Encoding utf8 dist/notes.md
          Get-Content dist/notes.md

      # the file name stays the same, so the README's "latest" link always works
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/MiusMissionMaker-windows.zip --title $env:GITHUB_REF_NAME --notes-file dist/notes.md --generate-notes
          if ($LASTEXITCODE) {
            gh release upload $env:GITHUB_REF_NAME dist/MiusMissionMaker-windows.zip --clobber
            gh release edit $env:GITHUB_REF_NAME --notes-file dist/notes.md
          }
